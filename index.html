<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript</title>

    <!-- Conectar CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Ejercicios de JavaScript</h1>

        <!-- EJERCICIO 1 -->
        <section>
            <h2>Ejercicio 1: Contador</h2>

            <p id="contador">0</p>

            <button id="incrementar">Incrementar</button>
            <button id="decrementar">Decrementar</button>
            <button id="reiniciar">Reiniciar</button>
        </section>


        <!-- EJERCICIO 2 -->
        <section>
            <h2>Ejercicio 2: Formulario sin recarga</h2>

            <form id="formulario">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="email">Email:</label>
                <input type="email" id="email" required>

                <button type="submit">Enviar</button>

            </form>

            <p id="resultado"></p>
        </section>


        <!-- EJERCICIO 3 -->
        <section>
            <h2>Ejercicio 3: Cambiar color de fondo</h2>

            <button id="cambiarColor">
                Cambiar color de fondo
            </button>
        </section>

    </div>

    <!-- Conectar JavaScript -->
    <script src="script.js"></script>

</body>
</html>
